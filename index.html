<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💎 Pandora 📦</h1>
    <div class="status-bar">
      <span id="level-display">Level 1</span>
      <button id="restart-btn" title="이 판 다시 시작">↺ Restart</button>
      <button id="reset-btn" title="처음부터 새로 시작">레벨 1에서 다시 시작</button>
    </div>
    <div id="banner" class="hidden">
      <span id="banner-msg"></span>
      <button id="banner-btn">Next Level ▶</button>
    </div>
  </header>

  <main>
    <div id="board"></div>
    <div class="board-footer">
      <span id="lives-display">❤️❤️❤️</span>
    </div>
    <div class="help">
      <div class="help-box">
        <strong>드래그</strong>
        <span>그리드 회전</span>
      </div>
      <div class="help-box">
        <strong>길게 눌러 드래그</strong>
        <span>✘ 없음 마킹</span>
      </div>
      <div class="help-box">
        <strong>더블클릭</strong>
        <span>상자 열어 보석 찾기</span>
      </div>
      <div class="help-box">
        <strong>핀치 / 휠</strong>
        <span>확대 · 축소</span>
      </div>
    </div>
    <p class="rules">각 행에 보석 한 개, 각 열에 보석 한 개, 각 색깔 영역에 보석 한 개, 보석 옆에는 보석이 있을 수 없어요! 일부 상자는 보자기로 색이 가려져 있지만, 그래도 논리만으로 풀 수 있어요.</p>
    <p class="credit">동명대학교 게임학부 강영민</p>
  </main>

  <div id="overlay" class="hidden">
    <div class="overlay-box">
      <h2 id="overlay-title"></h2>
      <p id="overlay-message"></p>
      <button id="overlay-btn"></button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
