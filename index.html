<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myMeowDoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🐾 myMeowDoku 😺</h1>
    <div class="status-bar">
      <span id="level-display">Level 1</span>
      <button id="restart-btn" title="이 판 다시 시작">↺ Restart</button>
      <button id="reset-btn" title="처음부터 새로 시작">레벨 1에서 다시 시작</button>
    </div>
    <div id="banner" class="hidden">
      <span id="banner-msg"></span>
      <button id="banner-btn">Next Level ▶</button>
    </div>
  </header>

  <main>
    <div id="board"></div>
    <div class="board-footer">
      <span id="lives-display">❤️❤️❤️</span>
    </div>
    <div class="help">
      <div class="help-box">
        <strong>클릭 / 드래그</strong>
        <span>🐾 마킹</span>
      </div>
      <div class="help-box">
        <strong>더블클릭</strong>
        <span>상자 열어 보석 찾기</span>
      </div>
      <div class="help-box">
        <strong>빈 공간 드래그</strong>
        <span>그리드 회전 · 휠로 확대</span>
      </div>
    </div>
    <p class="rules">각 행에 고양이 한 마리, 각 열에 고양이 한 마리, 각 색깔 영역에 고양이 한 마리, 고양이 옆에는 고양이가 있을 수 없어요!</p>
    <p class="credit">동명대학교 게임학부 강영민</p>
  </main>

  <div id="overlay" class="hidden">
    <div class="overlay-box">
      <h2 id="overlay-title"></h2>
      <p id="overlay-message"></p>
      <button id="overlay-btn"></button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
